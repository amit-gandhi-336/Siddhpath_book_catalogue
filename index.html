<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>My Book Store</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    body { margin:0; font-family:Arial,sans-serif; background:#f5f5f5; }
    header { display:flex; justify-content:space-between; padding:10px 16px; background:#222; color:#fff; }
    header img { height:40px; }
    header button { background:#ff9800; border:none; padding:8px 12px; border-radius:5px; cursor:pointer; }
    h1 { text-align:center; margin-top:20px; }
    .books { display:grid; grid-template-columns:repeat(auto-fit,minmax(250px,1fr)); gap:30px; padding:20px; }
    .book { background:#fff; padding:15px; border-radius:8px; box-shadow:0 2px 6px rgba(0,0,0,.1); }
    .book img { width:100%; height:350px; object-fit:contain; background:#eee; }
    .qty-box { display:flex; gap:8px; margin-top:8px; align-items:center; }
    .qty-box button { width:32px; height:32px; font-size:18px; border:none; background:#ddd; border-radius:4px; cursor:pointer; }
    .qty-box input { width:60px; text-align:center; font-size:16px; }
    .cart-btn { margin-top:12px; padding:8px 12px; background:#4CAF50; color:#fff; border:none; border-radius:5px; cursor:pointer; }
    #cartPanel { display:none; background:#fff; margin:20px; padding:15px; border-radius:8px; box-shadow:0 2px 6px rgba(0,0,0,.2); }
    .checkout { text-align:center; margin:30px; }
    .checkout button { padding:12px 20px; background:#25D366; color:#fff; border:none; border-radius:6px; cursor:pointer; }

    .modal { display:none; position:fixed; inset:0; background:rgba(0,0,0,.5); justify-content:center; align-items:center; }
    .modal-content { background:#fff; padding:20px; border-radius:8px; width:90%; max-width:400px; }
    .modal-content input, .modal-content textarea { width:100%; margin-top:10px; padding:8px; }
    .modal-actions { margin-top:15px; text-align:right; }
    .modal-actions button { padding:8px 14px; border:none; border-radius:4px; cursor:pointer; }
    .confirm-btn { background:#25D366; color:#fff; }
    .cancel-btn { background:#ccc; }
  </style>
</head>
<body>

<header>
  <div>
    <img src="logo.png">
    <strong>Siddhpath</strong>
  </div>
  <button onclick="toggleCart()">🛒 Cart (<span id="cartCount">0</span>)</button>
</header>

<h1>Books</h1>

<div class="books">
  <div class="book">
    <img src="book1.jpeg">
    <h3>The Power of your subconcious mind</h3>
    <p><strong>Author:</strong> Amit Gandhi</p>

    <div class="qty-box">
      <button onclick="changeQty(this,-1)">−</button>
      <input type="number" value="0" min="0" oninput="validateQty(this)">
      <button onclick="changeQty(this,1)">+</button>
    </div>

<div class="books">
  <div class="book">
    <img src="book4.jpg">
    <h3>The Alchemist</h3>
    <p><strong>Author:</strong> Amit Gandhi</p>

    <div class="qty-box">
      <button onclick="changeQty(this,-1)">−</button>
      <input type="number" value="0" min="0" oninput="validateQty(this)">
      <button onclick="changeQty(this,1)">+</button>
    </div>

<div class="books">
  <div class="book">
    <img src="book2.jpg">
    <h3>The Life that's waiting</h3>
    <p><strong>Author:</strong> Amit Gandhi</p>

    <div class="qty-box">
      <button onclick="changeQty(this,-1)">−</button>
      <input type="number" value="0" min="0" oninput="validateQty(this)">
      <button onclick="changeQty(this,1)">+</button>
    </div>

<div class="books">
  <div class="book">
    <img src="book3.jpg">
    <h3>Ikigai</h3>
    <p><strong>Author:</strong> Amit Gandhi</p>

    <div class="qty-box">
      <button onclick="changeQty(this,-1)">−</button>
      <input type="number" value="0" min="0" oninput="validateQty(this)">
      <button onclick="changeQty(this,1)">+</button>
    </div>

    <button class="cart-btn"
      onclick="addToCart('The Silent Journey', this.previousElementSibling.querySelector('input').value)">
      Add to Cart
    </button>
  </div>
</div>

<div id="cartPanel">
  <h3>Your Cart</h3>
  <div id="cartItems"></div>
</div>

<div class="checkout">
  <button onclick="openCustomerForm()">Send Order on WhatsApp</button>
</div>

<div class="modal" id="customerModal">
  <div class="modal-content">
    <h3>Your Details</h3>
    <input id="custName" placeholder="Your Name">
    <textarea id="custAddress" rows="3" placeholder="Delivery Address"></textarea>

    <div class="modal-actions">
      <button class="cancel-btn" onclick="closeCustomerForm()">Cancel</button>
      <button class="confirm-btn" onclick="confirmOrder()">Confirm & Send</button>
    </div>
  </div>
</div>

<script>
let cart = [];

function validateQty(i){ let v=parseInt(i.value); if(isNaN(v)||v<0)v=0; i.value=v; }
function changeQty(b,c){ const i=b.parentElement.querySelector('input'); let v=parseInt(i.value)+c; if(v<0)v=0; i.value=v; }

function addToCart(name,qty){
  qty=parseInt(qty);
  if(!qty) return alert("Select at least 1 book");
  const item=cart.find(i=>i.name===name);
  item?item.qty+=qty:cart.push({name,qty});
  updateCart();
  document.getElementById('cartPanel').style.display='block';
}

function updateCart(){
  let html='',total=0;
  cart.forEach((i,x)=>{ total+=i.qty; html+=`${i.name} – Qty: ${i.qty} <button onclick="removeItem(${x})">❌</button><br>`; });
  cartItems.innerHTML=html;
  cartCount.innerText=total;
}

function removeItem(i){ cart.splice(i,1); updateCart(); }
function toggleCart(){ cartPanel.style.display=cartPanel.style.display==='none'?'block':'none'; }

function openCustomerForm(){
  if(!cart.length) return alert("No books selected");
  customerModal.style.display='flex';
}
function closeCustomerForm(){ customerModal.style.display='none'; }

function confirmOrder(){
  const name=custName.value.trim();
  const addr=custAddress.value.trim();
  if(!name||!addr) return alert("Fill all details");

  let msg = `Order Request

Name: ${name}
Address: ${addr}

Books:
`;

  cart.forEach(i=> msg += `- ${i.name} (Qty: ${i.qty})\n`);

  window.open(`https://wa.me/917977517793?text=${encodeURIComponent(msg)}`,'_blank');

  cart=[]; updateCart(); closeCustomerForm(); cartPanel.style.display='none';
}
</script>

</body>
</html>
